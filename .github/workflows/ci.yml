# Continuous validation for pull requests and pushes to main.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          # Keep in sync with the helm version the chart is developed
          # against (v4.x line).
          version: latest
      - name: Lint chart
        run: helm lint .
      - name: Render default manifests
        run: helm template ci . > /dev/null
      - name: Render opt-in manifests
        run: |
          helm template ci . \
            --set serviceMonitor.enabled=true \
            --set grafanaDashboard.enabled=true \
            --set reloader.enabled=true > /dev/null
      - name: Render example routes
        run: |
          helm template ci . \
            --set-file routesToml=examples/routes.toml.example \
            > /dev/null
      - name: Schema rejects bad values
        run: |
          ! helm template ci . --set serviceType=NotAType > /dev/null